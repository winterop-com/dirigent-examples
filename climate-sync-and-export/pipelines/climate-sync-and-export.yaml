# Bring daily rainfall into a local open climate service, sync it forward, and export it per
# chiefdom as a DHIS2 dataValueSet, the chiefdoms read from the DHIS2 play demo.
#
# In:  a first window of CHIRPS v3 daily rainfall, and the day the sync brings it forward to.
# Out: a dataValueSet, one value per chiefdom and day, stored with the run and gated on shape.
#
# Hop by hop:
#
#   ingest     climate.ingest brings the dataset in over the instance's extent, from `start` to
#              `ingest_end`, as a background job the step follows to the end.
#   sync       climate.sync brings the same dataset forward from its last day to `end`. A sync
#              with nothing to fetch is answered at once, and the step ends on that answer.
#   units      dhis2.metadata reads the chiefdoms under `district` from the play demo, with
#              their polygons. Read only.
#   shapes     transform.jq turns them into a GeoJSON FeatureCollection, each feature's id the
#              chiefdom's uid, which is the org unit every exported value names.
#   aggregate  climate.job.run runs aggregate_to_dhis2_json as an openEO batch job: rainfall
#              averaged inside each chiefdom, per day, saved through the `rainfall-daily` export
#              the instance's climate-service.yaml declares.
#   export     climate.job.result downloads the job's saved result, the dataValueSet, into the
#              run's storage.
#   reload     storage.read reads it back as JSON, whatever its size.
#   check      validate.schema holds it to the shape a DHIS2 import takes, every identifier a
#              DHIS2 uid and every period a DHIS2 period.
#
#   uv run dg run --local pipelines/climate-sync-and-export.yaml --connections connections.yaml \
#     --schema schemas/rainfall-data-value-set.json

format: dirigent/v1
kind: pipeline
code: climate-sync-and-export
name: Sync rainfall and export it per chiefdom
description: |
  Ingest and sync CHIRPS daily rainfall in a local open climate service, and export it averaged
  over each chiefdom of a DHIS2 district as a dataValueSet.

  The chiefdoms are read from the DHIS2 play demo; nothing is written to it.

tags: [climate, dhis2]

requires:
  blocks:
    - climate.ingest
    - climate.sync
    - dhis2.metadata
    - transform.jq
    - climate.job.run
    - climate.job.result
    - storage.read
    - validate.schema
  connections:
    - climate-local
    - play
  schemas:
    - rainfall-data-value-set

params:
  type: object
  properties:
    dataset_id:
      type: string
      default: chirps3_precipitation_daily
      description: The managed dataset to ingest, sync and export.
    start:
      type: string
      format: date
      default: "2025-01-01"
      description: The first day the ingestion brings in.
    ingest_end:
      type: string
      format: date
      default: "2025-01-05"
      description: The last day the ingestion brings in.
    end:
      type: string
      format: date
      default: "2025-01-10"
      description: The last day the sync brings the dataset forward to, and the last day exported.
    district:
      type: string
      format: dhis2-uid
      default: O6uvpzGd5pu
      description: The district whose chiefdoms the rainfall is averaged over. Bo by default.
    export:
      type: string
      default: rainfall-daily
      description: The named export the instance declares.

steps:
  ingest:
    block: climate.ingest
    timeout: 1h
    # An ingestion is looked at every 30s unless the step says otherwise.
    poll: 5s
    config:
      connection: climate-local
      dataset_id: ${params.dataset_id}
      start: ${params.start}
      end: ${params.ingest_end}
      publish: true

  sync:
    block: climate.sync
    depends_on: [ingest]
    timeout: 1h
    poll: 5s
    config:
      connection: climate-local
      dataset_id: ${params.dataset_id}
      end: ${params.end}
      publish: true

  units:
    block: dhis2.metadata
    retry:
      max_attempts: 3
      backoff: 2s
    config:
      connection: play
      resource: organisationUnits
      fields: id,name,geometry
      filter: "parent.id:eq:${params.district}"
      order: [name:asc]

  shapes:
    block: transform.jq
    depends_on: [units]
    config:
      input: ${steps.units.output.rows}
      # A chiefdom with no polygon has nothing to average over, so it is left out.
      program: |
        {type: "FeatureCollection",
         features: [.[] | select(.geometry != null)
                    | {type: "Feature", id: .id, properties: {name: .name}, geometry: .geometry}]}

  aggregate:
    block: climate.job.run
    depends_on: [sync, shapes]
    timeout: 1h
    poll: 5s
    config:
      connection: climate-local
      title: "${params.dataset_id} ${params.start} to ${params.end}"
      workflow: aggregate_to_dhis2_json
      dataset_id: ${params.dataset_id}
      start: ${params.start}
      end: ${params.end}
      export: ${params.export}
      method: mean
      geometries: ${steps.shapes.output.value}

  export:
    block: climate.job.result
    depends_on: [aggregate]
    config:
      connection: climate-local
      job_id: ${steps.aggregate.output.job_id}

  reload:
    block: storage.read
    depends_on: [export]
    config:
      source: ${steps.export.output.uri}
      content_type: application/json
      max_size: 16mb

  check:
    block: validate.schema
    depends_on: [reload]
    config:
      input: ${steps.reload.output.value}
      schema: rainfall-data-value-set

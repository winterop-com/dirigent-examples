[project]
name = "everything"
version = "0.1.0"
description = "A dirigent project: pipeline documents, and the runtime that runs them."
requires-python = ">=3.13"
dependencies = [
    "dirigent-cli>=0.33,<0.34",
    # The DHIS2 blocks, the `dhis2` connection kind and the dhis2-uid format.
    "dirigent-dhis2>=0.33,<0.34",
    # The s3:// storage backend and the `s3` connection kind it resolves through.
    "dirigent-storage-s3>=0.33,<0.34",
    # convert.arrow and the parquet format the corpus's parquet recipes write.
    "dirigent-block-parquet>=0.33,<0.34",
    # The duckdb driver behind sql.query and sql.execute on a duckdb connection.
    "dirigent-block-duckdb>=0.33,<0.34",
]

# The same gate with the one line fixed, and the schema still carried in the document.
#
# reading is text matching a decimal, which is what a decimal written into a query string looks
# like at the far end -- and it would still catch `warm`. Give up on checking a value and you get
# nothing; check what it really is and you get the gate you wanted.
#
# A server stores no schema a document carries, exactly as it stores no connection a document
# carries: a schema is a thing the instance holds and a document names, so that two pipelines
# gating on the same shape are gating on the same shape. Applying this document is therefore
# refused, on purpose, and pipelines/echo-gate.yaml is the form an instance takes. A carried
# schema is still worth having, because a local run seeds what the document brought, and a local
# run is the fast loop.
#
#   dg run --local echo-gate-carried.yaml      # succeeded
#   dg apply echo-gate-carried.yaml            # refused, 422

format: dirigent/v1
kind: pipeline
code: echo-gate-carried
name: The gate, carried
description: The same gate with its schema carried in the document, which a local run seeds and a server refuses.

tags: [http, validate]

requires:
  blocks:
    - http.request
    - validate.schema

params:
  type: object
  properties:
    # Every URL in this document is built on this one value, so pointing the document at another
    # echo is a flag on the run rather than an edit: -p base_url=http://127.0.0.1:8080 runs it
    # against a stand-in on this machine, with no network at all.
    base_url:
      type: string
      default: https://postman-echo.com
      description: The echo service this document's requests are built on.
    station:
      type: string
      default: bergen-florida
      description: The station the reading is asked for.

steps:
  ask:
    block: http.request
    config:
      url: ${params.base_url}/get
      method: GET
      query:
        station: ${params.station}
        reading: "12.4"

  check:
    block: validate.schema
    depends_on: [ask]
    config:
      input: ${steps.ask.output.body}
      schema: echo-answer

schemas:
  echo-answer:
    title: The answer, as Postman Echo gives it
    type: object
    required: [args, url]
    properties:
      args:
        type: object
        required: [station, reading]
        properties:
          station:
            type: string
            minLength: 1
          reading:
            type: string
            pattern: "^-?[0-9]+(\\.[0-9]+)?$"
        additionalProperties: false
      url:
        type: string

# One local HAPI FHIR R4 server: the published image, pinned by digest, holding its data in memory,
# so a server started again starts empty. It is ready when GET /fhir/metadata answers, which takes
# a minute or so; verify.sh waits for that.
#
#   fhir  127.0.0.1:${FHIR_PORT:-9821}, which verify.sh seeds and the pipelines read
#
# verify.sh starts it under the compose project name dirigent-example-fhir-search-to-summary, so
# the container is this project's alone, and removes it on the way out. By hand:
#
#   docker compose -p dirigent-example-fhir-search-to-summary -f hapi/compose.yaml up -d
#   docker compose -p dirigent-example-fhir-search-to-summary -f hapi/compose.yaml down -v
#
# Nothing the server does reaches the network.

name: dirigent-example-fhir-search-to-summary

services:
  fhir:
    image: hapiproject/hapi:v8.12.0-2@sha256:0ff86aac4c7bd13a1ee226444a70263bb46ed1c28ef543c30a44f865b80ca04e
    environment:
      hapi.fhir.fhir_version: R4
    ports:
      - "127.0.0.1:${FHIR_PORT:-9821}:8080"

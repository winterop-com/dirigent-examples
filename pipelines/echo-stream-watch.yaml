# The batch that arrives, made a continuous source: a watch keeps one run always waiting on it.
#
# In:  nothing but parameters.
# Out: per run, one batch of three readings, summarised: how many, and the offsets they took.
#
# echo-stream-wait.yaml waits once and is done. This document waits over and over. Its watch
# keeps exactly one run of the pipeline waiting on the `wait` step; the transaction that settles
# that step's success arms the next run, and the run that succeeded carries on downstream. The
# runs overlap: one batch is being worked on while the next is being waited for, the way a topic
# is consumed.
#
# Hop by hop:
#
#   wait       playground.arrive, parked for two seconds, then a batch of three readings. Under
#              the watch its offsets carry on from the batch before: 0 to 2, then 3 to 5, and on.
#   work       playground.generate over the batch's messages, three seconds long: work that
#              takes longer than the next wait, so the next run's batch has arrived before this
#              run is done. Stand-in for whatever a real pipeline does with a batch.
#   summarise  reads the batch the way a step downstream of a topic would: how many, the first
#              and last offset, and where the next batch starts.
#
# THE WATCH OWNS THE CURSOR. playground.arrive says where its batch ended (`next_offset`), the
# watch stores that, and the next run's first poke starts from it. A paused watch keeps it, so a
# resume reads on from where the pause left off rather than from zero.
#
# The watch is declared paused, so an apply does not set it going; `dg watch` steers it:
#
#   uv run dg apply
#   uv run dg watch resume echo-stream-watch follow   # arms the first run
#   uv run dg runs list --pipeline echo-stream-watch   # a new run every two seconds or so
#   uv run dg watch list echo-stream-watch             # the run it has waiting, and the cursor
#   uv run dg watch pause echo-stream-watch follow     # cancels the waiting run, keeps the cursor
#
# `dg run --local` runs the pipeline once, as an ordinary run with no watch behind it, so its
# offsets start at zero.
#
# EXPECT A LOCAL RUN TO SUCCEED in about five seconds, with offsets 0 to 2.
#
#   uv run dg run --local pipelines/echo-stream-watch.yaml

format: dirigent/v1
kind: pipeline
code: echo-stream-watch
name: A batch that keeps arriving
description: |
  A watch keeps one run waiting on playground.arrive and arms the next the moment a batch
  arrives, so the runs overlap and the offsets carry on from one batch to the next.

tags: [playground, sensor, transform, streaming, triggers]

requires:
  blocks:
    - playground.arrive
    - playground.generate
    - transform.jq

steps:
  wait:
    block: playground.arrive
    # A watch waits on a root step, one that depends on nothing, and on a sensor: the watch is
    # refused at apply otherwise.
    poll: 1s
    deadline: 1m
    config:
      # Two seconds from when the attempt started. after_pokes is zero because the clock is
      # what this wait is about.
      after: 2s
      after_pokes: 0
      rows: 3
      seed: 7
      fields:
        station: city
        reading: pyfloat

  work:
    block: playground.generate
    depends_on: [wait]
    config:
      # Named no fields, so the messages pass through unchanged; the delay is the point.
      input: ${steps.wait.output.messages}
      delay: 3s

  summarise:
    block: transform.jq
    depends_on: [work]
    config:
      input: ${steps.wait.output}
      program: >-
        {count: .count, first_offset: .messages[0].offset,
         last_offset: .messages[-1].offset, next_offset: .next_offset}

triggers:
  watches:
    - code: follow
      name: Follow the arrivals
      # The step every armed run waits on. Its success arms the next run; everything
      # downstream of it runs in the run that succeeded.
      step: wait
      # Created paused, so nothing starts until `dg watch resume`.
      paused: true

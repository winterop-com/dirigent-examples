# Ask Postman Echo for one station's reading.
#
# http.request is the generic HTTP call, and url: is an absolute address -- which is all a one-off
# call needs. The alternative is a connection: a coded record the instance holds, carrying a base
# URL, its credential, its TLS setting and its timeout, which a step names with connection: and a
# path:. That is what you reach for the moment two steps call the same host, or the host wants a
# password. This one calls a public endpoint once, so it needs neither.
#
#   dg run --local pipelines/echo-read.yaml
#   dg run --local pipelines/echo-read.yaml -p station=oslo-blindern

format: dirigent/v1
kind: pipeline
code: echo-read
name: Echo read
description: Ask Postman Echo for one station's reading, and read what it answers.

tags: [http, params]

requires:
  blocks:
    - http.request

# A JSON Schema over the run's parameters. A parameter with a default may be left out; one
# without must be given, and a value the schema refuses stops the run before a single call is
# made.
params:
  type: object
  properties:
    # Every URL in this document is built on this one value, so pointing the document at another
    # echo is a flag on the run rather than an edit: -p base_url=http://127.0.0.1:8080 runs it
    # against a stand-in on this machine, with no network at all.
    base_url:
      type: string
      default: https://postman-echo.com
      description: The echo service this document's requests are built on.
    station:
      type: string
      default: bergen-florida
      description: The station the reading is asked for.
    reading:
      type: string
      default: "12.4"
      description: The reading to send along with it.

steps:
  ask:
    block: http.request
    config:
      url: ${params.base_url}/get
      method: GET
      # query: is the ?station=...&reading=... of the request, and ${params.<name>} reads the
      # run's parameter. Postman Echo answers a GET with the arguments it was given, so what
      # comes back under body.args is the proof of what was asked.
      query:
        station: ${params.station}
        reading: ${params.reading}

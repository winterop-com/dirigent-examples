# One reading, out to a bucket and back, on an instance whose whole artifact root is that bucket.
#
# There is no "upload to S3" block and no "download from S3" block. s3:// is a registered URI
# scheme, so the ordinary storage.write and storage.read address it exactly as they address
# file://, and what makes the scheme work is two settings and one connection on the instance:
#
#   DIRIGENT_STORAGE_CONNECTIONS=s3=artifacts   which s3 connection serves the scheme
#   DIRIGENT_ARTIFACT_ROOT=s3://<bucket>/artifacts   where ${run.scratch} lives
#
# THE READ IS A NODE, NOT A CALL. playground.generate takes an `input`, adds the fields it is
# asked for, and hands the result back -- so the reading below is made on this machine and
# nothing outside the bucket is reached. Replacing `ask` with an http.request whose answer the
# write reads changes that one step and nothing under it.
#
# Hop by hop:
#
#   ask    the reading: the station this run was asked for, with a temperature generated onto
#          it. Seeded, so the same run writes the same bytes.
#   save   the reading to an object this document names, at a bucket and key it spells out.
#   stash  the same reading to ${run.scratch}, which names no scheme at all. On this instance
#          both land in the same bucket -- one because the document says s3://, one because
#          the instance's artifact root does. That pair is the whole lesson: a document that
#          writes to scratch moves from a disk to a bucket without being edited.
#   back   the object read again, at the uri the write reported rather than the path typed
#          a second time.
#   say    what came back, in the run's log.
#
#   uv run dg run echo-s3 --watch
#   uv run dg run echo-s3 -p station=oslo-blindern --watch

format: dirigent/v1
kind: pipeline
code: echo-s3
name: A reading, through a bucket
description: |
  Generate one station's reading, write it to an object in S3, read it back and say what came
  back -- on an instance whose run scratch is in the same bucket.

tags: [playground, storage, s3]

# The preflight this document declares. `storage: [s3]` is the one worth noticing: it says the
# instance must serve the scheme, so one without dirigent-storage-s3 installed refuses the
# document at apply rather than failing a run halfway through.
requires:
  blocks:
    - playground.generate
    - storage.write
    - storage.read
    - log.write
  connections:
    - artifacts
  storage:
    - s3

params:
  type: object
  properties:
    station:
      type: string
      default: bergen-florida
      description: The station the reading is for, and the object it is named as.
    bucket:
      type: string
      default: echo-s3
      description: The bucket the reading is written into. It must exist; a write does not create one.

steps:
  ask:
    block: playground.generate
    config:
      rows: 1
      # Seeded, so the same station writes the same bytes on every run.
      seed: 4
      # The station is the input and travels through; celsius is generated onto it, because
      # fields: are named.
      input:
        station: ${params.station}
      fields:
        celsius:
          provider: pyfloat
          args:
            min_value: -20
            max_value: 30
            right_digits: 1

  save:
    block: storage.write
    depends_on: [ask]
    config:
      # The bucket always comes from the URI, never from the connection: the connection's own
      # bucket field is only what `dg connection check artifacts` probes.
      target: s3://${params.bucket}/echo/${params.station}.json
      # The node's records are a list, and this document's object is one reading, so the
      # reference indexes into it -- an array index is a dot like any other.
      #
      # A value is written as canonical JSON -- sorted keys, no spaces -- so the same reading
      # writes the same bytes every run.
      value: ${steps.ask.output.records.0}
      # Stored on the object, so whoever fetches it out of the bucket is told what it is.
      content_type: application/json

  stash:
    block: storage.write
    depends_on: [ask]
    config:
      # No scheme, no bucket, no host: this run's own prefix under whatever the instance's
      # artifact root is. A temporary directory under `dg run --local`, and the bucket here.
      target: ${run.scratch}/echo/${params.station}.json
      value: ${steps.ask.output.records.0}
      content_type: application/json

  back:
    block: storage.read
    depends_on: [save]
    config:
      source: ${steps.save.output.uri}

  say:
    block: log.write
    depends_on: [back, stash]
    config:
      message: >-
        ${steps.back.output.bytes_read} bytes back from ${steps.save.output.uri}
        for station ${steps.back.output.value.station}, with this run's scratch
        at ${steps.stash.output.uri}

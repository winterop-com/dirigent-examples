# A dirigent pipeline project: a working set of documents, not a source of truth.
# The server is where definitions actually live; `dg apply` puts these there.

project:
  pipelines: pipelines
  profile: local

  # Block ids every document here assumes. `dg apply` checks these against the target
  # instance's catalog first, and fails with a complete list of what is missing.
  requires: []

# This instance's settings. Everything not named here keeps its default; the whole list,
# with defaults and descriptions, is in dirigent.example.yaml beside this file.

environment: "local"
# The port this project's instance listens on, and every document here addresses.
port: 4444
log_level: "INFO"
worker_concurrency: 8

# The unsafe blocks the documents use, and the connection serving s3://, are named in the
# process environment, not here: this file travels with a checkout, so dg does not read either
# from it. bootstrap.sh exports both for setup.sh and verify.sh, and the README shows the export
# for an instance started by hand.

# The tag the docker and git shelves' documents require of the worker that runs them.
worker_tags: ["docker"]
